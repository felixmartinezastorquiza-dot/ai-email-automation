<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oakridge Homes · AI Inbox Assistant</title>
  <meta name="description" content="AI triage for a real estate agency's inbox: classifies emails, extracts lead data and flags what needs a human.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
</head>
<body>
  <div class="demo-banner" role="note">
    Demo project with sample data · Oakridge Homes is a fictional agency and all emails are made up
  </div>

  {% block content %}{% endblock %}

  <footer class="footer">
    <p class="signature">Built by <strong>{{ settings.author_name }}</strong> · {{ settings.author_title }}</p>
    <p class="tech">FastAPI · HTMX · Claude · PostgreSQL · <a href="/docs">API docs</a></p>
  </footer>
</body>
</html>
