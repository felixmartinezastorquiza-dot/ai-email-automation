[project]
name = "ai-email-automation"
version = "0.1.0"
description = "AI triage for a real estate agency's inbox: classifies emails, extracts lead data and flags what needs a human."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=1.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.8",
]
gmail = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
